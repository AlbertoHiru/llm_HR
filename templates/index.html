<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AskMyDocs</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen font-sans">

    <div class="max-w-3xl mx-auto px-4 py-12">

        <h1 class="text-3xl font-bold text-white mb-2">AskMyDocs</h1>
        <p class="text-gray-400 mb-8">Sube un PDF y conversa con tu documento.</p>

        <!-- Upload -->
        <div class="bg-gray-900 rounded-xl p-6 mb-6 border border-gray-800">
            <label class="block text-sm text-gray-400 mb-3">Sube tu PDF (máximo 50 páginas)</label>
            <input type="file" id="fileInput" accept=".pdf"
                class="block w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4
                       file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white
                       file:cursor-pointer hover:file:bg-indigo-700 cursor-pointer"/>
            <button onclick="uploadFile()"
                class="mt-4 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg text-sm transition">
                Cargar PDF
            </button>
            <p id="uploadStatus" class="mt-3 text-sm text-gray-500"></p>
        </div>

        <!-- Acciones -->
        <div class="grid grid-cols-3 gap-3 mb-6">
            <button onclick="action('summarize')"
                class="bg-gray-800 hover:bg-gray-700 text-sm px-4 py-3 rounded-lg transition">
                Resumir
            </button>
            <button onclick="action('flashcards')"
                class="bg-gray-800 hover:bg-gray-700 text-sm px-4 py-3 rounded-lg transition">
                Flashcards
            </button>
            <button onclick="action('exam')"
                class="bg-gray-800 hover:bg-gray-700 text-sm px-4 py-3 rounded-lg transition">
                Examen
            </button>
        </div>

        <!-- Pregunta -->
        <div class="bg-gray-900 rounded-xl p-6 mb-6 border border-gray-800">
            <label class="block text-sm text-gray-400 mb-3">Hazle una pregunta a tu documento</label>
            <div class="flex gap-3">
                <input type="text" id="questionInput" placeholder="¿De qué trata el documento?"
                    class="flex-1 bg-gray-800 text-gray-100 px-4 py-2 rounded-lg text-sm
                           border border-gray-700 focus:outline-none focus:border-indigo-500"/>
                <button onclick="askQuestion()"
                    class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm transition">
                    Preguntar
                </button>
            </div>
        </div>

        <!-- Respuesta -->
        <div id="responseBox" class="hidden bg-gray-900 rounded-xl p-6 border border-gray-800">
            <p class="text-sm text-gray-400 mb-3">Respuesta</p>
            <div id="responseText" class="text-gray-100 text-sm whitespace-pre-wrap leading-relaxed"></div>
        </div>

    </div>

    <script>
        async function uploadFile() {
            const file = document.getElementById("fileInput").files[0];
            if (!file) return;
            const status = document.getElementById("uploadStatus");
            status.textContent = "Cargando...";
            const formData = new FormData();
            formData.append("file", file);
            const res = await fetch("/upload", { method: "POST", body: formData });
            const data = await res.json();
            status.textContent = data.message;
        }

        async function action(type) {
            showLoading();
            const res = await fetch(`/${type}`, { method: "POST" });
            const data = await res.json();
            showResponse(data.response);
        }

        async function askQuestion() {
            const question = document.getElementById("questionInput").value;
            if (!question) return;
            showLoading();
            const res = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question })
            });
            const data = await res.json();
            showResponse(data.response);
        }

        function showLoading() {
            document.getElementById("responseBox").classList.remove("hidden");
            document.getElementById("responseText").textContent = "Generando respuesta...";
        }

        function showResponse(text) {
            document.getElementById("responseText").textContent = text;
        }
    </script>

</body>
</html>
